<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pago de Barbería - Tasa BCV</title>
  <style>
    * { box-sizing: border-box; }
    
    body { 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
      padding: 20px 15px; 
      margin: 0; 
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f4f6f9;
    }

    .card { 
      background: #ffffff; 
      padding: 24px 20px; 
      border-radius: 16px; 
      box-shadow: 0 10px 25px rgba(0,0,0,0.08); 
      width: 100%;
      max-width: 420px;
    }
    
    .tasa-box { 
      background: #f1f3f5; 
      padding: 14px; 
      border-radius: 8px; 
      text-align: center; 
      font-size: 14px; 
      color: #333333; 
      margin-bottom: 22px;
      line-height: 1.4;
    }
    .tasa-box strong { font-size: 15px; }
    .tasa-fecha { display: block; font-size: 12px; color: #666; margin-top: 4px; }
    
    .servicio-header { text-align: center; margin-bottom: 20px; }
    .servicio-header h2 { margin: 0; font-size: 22px; font-weight: 700; color: #111111; }
    .servicio-header p { margin: 6px 0 0 0; color: #555555; font-size: 15px; }

    .contador-container { 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      gap: 20px; 
      margin: 25px 0 30px 0; 
    }
    
    .btn-qty { 
      width: 50px; 
      height: 50px; 
      color: #ffffff !important; 
      border: none; 
      border-radius: 50%; 
      font-size: 28px; 
      font-weight: bold; 
      line-height: 1;
      cursor: pointer; 
      display: flex; 
      align-items: center; 
      justify-content: center;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.15);
    }
    .btn-qty:active { transform: scale(0.95); }
    
    .btn-restar { background-color: #d32f2f; }
    .btn-sumar { background-color: #2e7d32; }

    .qty-display { font-size: 22px; font-weight: bold; width: 35px; text-align: center; color: #111; }

    .pago-box { 
      margin-top: 10px; 
      padding: 18px 16px; 
      background-color: #f7fbff;
      border: 1px dashed #a0b2c6; 
      border-radius: 10px; 
    }
    .pago-box h3 { 
      margin-top: 0; 
      font-size: 16px; 
      color: #0d4b82; 
      text-align: center; 
      margin-bottom: 14px; 
      font-weight: 700;
    }
    .pago-datos p { margin: 10px 0; font-size: 15px; color: #222; }

    .btn-copiar { 
      display: block; 
      width: 100%; 
      margin-top: 18px; 
      padding: 14px; 
      background-color: #0066cc; 
      color: white; 
      border: none; 
      border-radius: 8px; 
      font-size: 16px; 
      font-weight: bold; 
      cursor: pointer; 
      text-align: center; 
    }
    .btn-copiar:active { background-color: #004c99; }
    
    .mensaje-copiado { 
      display: none; 
      color: #2e7d32; 
      text-align: center; 
      font-size: 14px; 
      margin-top: 10px; 
      font-weight: bold; 
    }
  </style>
</head>
<body>

<div class="card">
  <div class="tasa-box">
    Tasa BCV: <strong id="tasa-bcv">Cargando...</strong>
    <span class="tasa-fecha" id="tasa-fecha"></span>
  </div>

  <div class="servicio-header">
    <h2>Corte de Cabello</h2>
    <p>Precio base: <strong>3.40 $</strong> por corte</p>
  </div>

  <!-- Selector de Cantidad -->
  <div class="contador-container">
    <button class="btn-qty btn-restar" onclick="cambiarCantidad(-1)">-</button>
    <span class="qty-display" id="cantidad">1</span>
    <button class="btn-qty btn-sumar" onclick="cambiarCantidad(1)">+</button>
  </div>

  <!-- Datos para Pago Móvil -->
  <div class="pago-box">
    <h3>Datos para Pago Móvil</h3>
    <div class="pago-datos">
      <p><strong>Banco:</strong> <span id="datos-banco">0102 (BDV)</span></p>
      <p><strong>Cédula:</strong> <span id="datos-cedula">25400702</span></p>
      <p><strong>Teléfono:</strong> <span id="datos-telefono">04127472727</span></p>
      <p><strong>Monto total:</strong> <span id="datos-monto-final" style="font-weight: bold; color: #2e7d32;">0.00 Bs.</span></p>
    </div>

    <button class="btn-copiar" onclick="copiarDatosPago()">Copiar datos de pago</button>
    <div id="mensaje" class="mensaje-copiado">¡Datos copiados al portapapeles!</div>
  </div>
</div>

<script>
  const PRECIO_UNITARIO_USD = 3.40;
  let tasaGlobal = 0;
  let cantidadCortes = 1;

  async function obtenerTasa() {
    const fuentes = [
      {
        url: "https://ve.dolarapi.com/v1/dolares/oficial",
        extraer: (data) => {
          let fechaObj = data.fechaActualizacion ? new Date(data.fechaActualizacion) : new Date();
          return {
            promedio: parseFloat(data.promedio),
            fechaHora: fechaObj.toLocaleString("es-VE", {
              day: "2-digit",
              month: "2-digit",
              year: "numeric",
              hour: "2-digit",
              minute: "2-digit",
              hour12: true
            })
          };
        }
      },
      {
        url: "https://pydolarvenezuela-api.vercel.app/api/v1/dollar?page=bcv",
        extraer: (data) => ({
          promedio: parseFloat(data.monedas.usd.promedio),
          fechaHora: data.monedas.usd.fechaActualizacion || new Date().toLocaleString("es-VE")
        })
      }
    ];

    for (let fuente of fuentes) {
      try {
        const res = await fetch(fuente.url);
        if (!res.ok) continue;
        const data = await res.json();
        const resultado = fuente.extraer(data);

        if (resultado.promedio && !isNaN(resultado.promedio) && resultado.promedio > 0) {
          tasaGlobal = resultado.promedio;
          document.getElementById("tasa-bcv").innerText = `${tasaGlobal.toFixed(2)} Bs./USD`;

          const hoy = new Date();
          const diaSemana = hoy.getDay();
          const esFinDeSemana = (diaSemana === 0 || diaSemana === 6);

          let textoFecha = `Actualizado: ${resultado.fechaHora}`;
          if (esFinDeSemana) {
            textoFecha += " (Tasa Lunes)";
          }

          document.getElementById("tasa-fecha").innerText = textoFecha;
          calcularMontoTotal();
          return;
        }
      } catch (err) {
        console.warn(`Falló fuente ${fuente.url}`);
      }
    }

    document.getElementById("tasa-bcv").innerText = "Error de red";
  }

  function cambiarCantidad(cambio) {
    cantidadCortes += cambio;
    if (cantidadCortes < 1) cantidadCortes = 1;
    
    document.getElementById("cantidad").innerText = cantidadCortes;
    calcularMontoTotal();
  }

  function calcularMontoTotal() {
    if (tasaGlobal === 0) return;
    
    const totalUSD = cantidadCortes * PRECIO_UNITARIO_USD;
    const totalBs = (totalUSD * tasaGlobal).toFixed(2);

    document.getElementById("datos-monto-final").innerText = `${totalBs} Bs.`;
  }

  function copiarDatosPago() {
    const banco = document.getElementById("datos-banco").innerText;
    const cedula = document.getElementById("datos-cedula").innerText;
    const telefono = document.getElementById("datos-telefono").innerText;
    const monto = document.getElementById("datos-monto-final").innerText;

    const textoACopiar = `${banco}\n${cedula}\n${telefono}\n${monto}`;

    navigator.clipboard.writeText(textoACopiar).then(() => {
      const msj = document.getElementById("mensaje");
      msj.style.display = "block";
      setTimeout(() => { msj.style.display = "none"; }, 3000);
    }).catch(err => {
      console.error("Error al copiar: ", err);
    });
  }

  obtenerTasa();
</script>

</body>
</html>
