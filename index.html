<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pago de Barbería - Tasa BCV</title>
  <style>
    * { box-sizing: border-box; }
    
    body { 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
      padding: 20px 15px; 
      margin: 0; 
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      /* Fondo exterior desenfocado con tono oscuro de barbería */
      background: linear-gradient(rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.4)), 
                  url('https://images.unsplash.com/photo-1503951914875-452162b0f3f1?auto=format&fit=crop&q=80&w=1000') center/cover no-repeat fixed;
    }

    .card { 
      background: #ffffff; 
      padding: 24px 20px; 
      border-radius: 16px; 
      box-shadow: 0 10px 25px rgba(0,0,0,0.3); 
      width: 100%;
      max-width: 420px;
    }
    
    .tasa-box { 
      background: #f1f3f5; 
      padding: 14px; 
      border-radius: 8px; 
      text-align: center; 
      font-size: 15px; 
      color: #333333; 
      margin-bottom: 22px;
    }
    
    .servicio-header { text-align: center; margin-bottom: 20px; }
    .servicio-header h2 { margin: 0; font-size: 22px; font-weight: 700; color: #111111; }
    .servicio-header p { margin: 6px 0 0 0; color: #555555; font-size: 15px; }

    .contador-container { 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      gap: 20px; 
      margin: 25px 0 30px 0; 
    }
    
    /* Botones circulares en 3D con degradado suave */
    .btn-qty { 
      width: 52px; 
      height: 52px; 
      color: white; 
      border: none; 
      border-radius: 50%; 
      font-size: 26px; 
      font-weight: bold; 
      cursor: pointer; 
      display: flex; 
      align-items: center; 
      justify-content: center;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.25);
      transition: transform 0.1s ease, box-shadow 0.1s ease;
    }
    .btn-qty:active {
      transform: scale(0.95);
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
    }
    
    /* Menos (Rojo Degradado) */
    .btn-restar { 
      background: linear-gradient(135deg, #bd3a3a 0%, #8b1e1e 100%); 
    }

    /* Más (Verde Degradado) */
    .btn-sumar { 
      background: linear-gradient(135deg, #519e54 0%, #2e6931 100%); 
    }

    .qty-display { font-size: 22px; font-weight: bold; width: 35px; text-align: center; color: #111; }

    /* Caja de Pago Móvil con bordes punteados y fondo de textura tenue */
    .pago-box { 
      position: relative;
      margin-top: 10px; 
      padding: 18px 16px; 
      background-color: #f7fbff;
      /* Marca de agua tenue del poste de barbería */
      background-image: radial-gradient(circle, rgba(0,102,204,0.03) 0%, transparent 70%);
      border: 1px dashed #a0b2c6; 
      border-radius: 10px; 
    }
    .pago-box h3 { 
      margin-top: 0; 
      font-size: 16px; 
      color: #0d4b82; 
      text-align: center; 
      margin-bottom: 14px; 
      font-weight: 700;
    }
    .pago-datos p { margin: 10px 0; font-size: 15px; color: #222; }

    /* Botón Copiar con degradado azul estilo botón metálico */
    .btn-copiar { 
      display: block; 
      width: 100%; 
      margin-top: 18px; 
      padding: 14px; 
      background: linear-gradient(180deg, #1d6fa5 0%, #124d77 100%); 
      color: white; 
      border: none; 
      border-radius: 10px; 
      font-size: 16px; 
      font-weight: bold; 
      cursor: pointer; 
      text-align: center; 
      box-shadow: 0 4px 8px rgba(18, 77, 119, 0.3);
      transition: background 0.2s ease;
    }
    .btn-copiar:active { 
      background: linear-gradient(180deg, #15547e 0%, #0d3857 100%); 
    }
    
    .mensaje-copiado { 
      display: none; 
      color: #2e7d32; 
      text-align: center; 
      font-size: 14px; 
      margin-top: 10px; 
      font-weight: bold; 
    }
  </style>
</head>
<body>

<div class="card">
  <div class="tasa-box">
    Tasa Oficial BCV: <strong id="tasa-bcv">Cargando...</strong>
  </div>

  <div class="servicio-header">
    <h2>Corte de Cabello</h2>
    <p>Precio base: <strong>3.40 $</strong> por corte</p>
  </div>

  <!-- Selector de Cantidad -->
  <div class="contador-container">
    <button class="btn-qty btn-restar" onclick="cambiarCantidad(-1)">−</button>
    <span class="qty-display" id="cantidad">1</span>
    <button class="btn-qty btn-sumar" onclick="cambiarCantidad(1)">+</button>
  </div>

  <!-- Datos para Pago Móvil -->
  <div class="pago-box">
    <h3>Datos para Pago Móvil</h3>
    <div class="pago-datos">
      <p><strong>Banco:</strong> <span id="datos-banco">0102 (BDV)</span></p>
      <p><strong>Cédula:</strong> <span id="datos-cedula">25400702</span></p>
      <p><strong>Teléfono:</strong> <span id="datos-telefono">04127472727</span></p>
      <p><strong>Monto total:</strong> <span id="datos-monto-final" style="font-weight: bold; color: #2e7d32;">0.00 Bs.</span></p>
    </div>

    <button class="btn-copiar" onclick="copiarDatosPago()">Copiar datos de pago</button>
    <div id="mensaje" class="mensaje-copiado">¡Datos copiados al portapapeles!</div>
  </div>
</div>

<script>
  const PRECIO_UNITARIO_USD = 3.40;
  let tasaGlobal = 0;
  let cantidadCortes = 1;

  async function obtenerTasa() {
    const fuentes = [
      {
        url: "https://ve.dolarapi.com/v1/dolares/oficial",
        extraer: (data) => parseFloat(data.promedio)
      },
      {
        url: "https://pydolarvenezuela-api.vercel.app/api/v1/dollar?page=bcv",
        extraer: (data) => parseFloat(data.monedas.usd.promedio)
      },
      {
        url: "https://pydolarvenezuela-api.vercel.app/api/v1/dollar/unit/bcv",
        extraer: (data) => parseFloat(data.price)
      }
    ];

    for (let fuente of fuentes) {
      try {
        const res = await fetch(fuente.url);
        if (!res.ok) continue;
        const data = await res.json();
        const valorTasa = fuente.extraer(data);

        if (valorTasa && !isNaN(valorTasa) && valorTasa > 0) {
          tasaGlobal = valorTasa;
          document.getElementById("tasa-bcv").innerText = `${tasaGlobal.toFixed(2)} Bs./USD`;
          calcularMontoTotal();
          return;
        }
      } catch (err) {
        console.warn(`Falló fuente ${fuente.url}`);
      }
    }

    document.getElementById("tasa-bcv").innerText = "Error de red";
  }

  function cambiarCantidad(cambio) {
    cantidadCortes += cambio;
    if (cantidadCortes < 1) cantidadCortes = 1;
    
    document.getElementById("cantidad").innerText = cantidadCortes;
    calcularMontoTotal();
  }

  function calcularMontoTotal() {
    if (tasaGlobal === 0) return;
    
    const totalUSD = cantidadCortes * PRECIO_UNITARIO_USD;
    const totalBs = (totalUSD * tasaGlobal).toFixed(2);

    document.getElementById("datos-monto-final").innerText = `${totalBs} Bs.`;
  }

  function copiarDatosPago() {
    const banco = document.getElementById("datos-banco").innerText;
    const cedula = document.getElementById("datos-cedula").innerText;
    const telefono = document.getElementById("datos-telefono").innerText;
    const monto = document.getElementById("datos-monto-final").innerText;

    const textoACopiar = `Datos de Pago Móvil:\nBanco: ${banco}\nCédula: ${cedula}\nTeléfono: ${telefono}\nMonto: ${monto}`;

    navigator.clipboard.writeText(textoACopiar).then(() => {
      const msj = document.getElementById("mensaje");
      msj.style.display = "block";
      setTimeout(() => { msj.style.display = "none"; }, 3000);
    }).catch(err => {
      console.error("Error al copiar: ", err);
    });
  }

  obtenerTasa();
</script>

</body>
</html>
